<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StkTable 滚动性能基准测试报告</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
  :root { --bg: #0f1117; --card: #181b24; --border: #2a2e3a; --text: #e0e0e0; --muted: #8b8fa3; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 24px; }
  h1 { text-align: center; font-size: 28px; margin-bottom: 6px; background: linear-gradient(135deg, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .subtitle { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 32px; }
  .loading { text-align: center; padding: 80px 0; color: var(--muted); font-size: 16px; }
  .loading .spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: #60a5fa; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 10px; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { text-align: center; padding: 60px 20px; color: #fb7185; }
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 28px; max-width: 1400px; margin-left: auto; margin-right: auto; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; text-align: center; }
  .stat .val { font-size: 28px; font-weight: 700; }
  .stat .label { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.4; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1400px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .card.full { grid-column: 1 / -1; }
  .card h2 { font-size: 16px; color: #a0a8c0; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .card h2 .tag { font-size: 11px; padding: 2px 8px; border-radius: 4px; background: #2a2e3a; color: #8b8fa3; font-weight: normal; }
  .chart { width: 100%; height: 360px; }
  .chart.tall { height: 440px; }
  .section-title { max-width: 1400px; margin: 36px auto 16px; font-size: 20px; color: #c0c8e0; font-weight: 600; }
  .section-title:first-of-type { margin-top: 0; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } .summary { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>

<h1>StkTable 滚动性能基准测试</h1>
<p class="subtitle" id="subtitle">加载中...</p>

<div id="app">
  <div class="loading"><span class="spinner"></span>正在加载数据...</div>
</div>

<script>
// ── Color palette ──────────────────────────────────────────────────────────
const PALETTE = [
  '#60a5fa','#818cf8','#a78bfa','#c084fc','#f472b6','#fb923c',
  '#fbbf24','#34d399','#2dd4bf','#38bdf8','#84cc16','#e879f9',
  '#f97316','#ef4444','#06b6d4','#14b8a6','#8b5cf6','#d946ef',
];

// ─── Category config ────────────────────────────────────────────────────────
const CATEGORY_CONFIG = {
  vertical:   { title: '纵向滚动',  icon: '↕' },
  horizontal: { title: '横向滚动',  icon: '↔' },
  merge:      { title: '单元格合并', icon: '⊞' },
  header:     { title: '多级表头',  icon: '≡' },
  combined:   { title: '组合场景',  icon: '⚡' },
};

// ─── Helpers ────────────────────────────────────────────────────────────────

function baseOpt() {
  return {
    backgroundColor: 'transparent',
    textStyle: { color: '#b0b8d0' },
    legend: { textStyle: { color: '#8b8fa3', fontSize: 11 }, top: 0, type: 'scroll' },
    grid: { left: 55, right: 20, top: 44, bottom: 30 },
    tooltip: { trigger: 'axis', backgroundColor: '#1e2130', borderColor: '#3a3f52', textStyle: { color: '#e0e0e0', fontSize: 12 } },
  };
}

function mkBar(name, data, color) {
  return { name, type: 'bar', data, itemStyle: { color, borderRadius: [3,3,0,0] }, barMaxWidth: 28, emphasis: { focus: 'series' } };
}

function mkLine(name, data, color) {
  return { name, type: 'line', data, symbol: 'circle', symbolSize: 6, lineStyle: { width: 2, color }, itemStyle: { color }, emphasis: { focus: 'series' } };
}

function fmt(v, decimals = 2) {
  if (v == null) return '-';
  return typeof v === 'number' ? v.toFixed(decimals) : v;
}

// ─── Main: load data and render ─────────────────────────────────────────────

(async function main() {
  let data;
  try {
    const resp = await fetch('./data.json');
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    data = await resp.json();
  } catch (e) {
    document.getElementById('app').innerHTML = `<div class="error">无法加载数据: ${e.message}<br><br>请确保 data.json 存在于同一目录下。<br>运行 <code>node test/perf/run-perf-benchmark.mjs</code> 生成数据。</div>`;
    document.getElementById('subtitle').textContent = '加载失败';
    return;
  }

  const { versions, scenarios, bundleSize = {}, generatedAt } = data;
  document.getElementById('subtitle').textContent =
    `${versions.join(' → ')}  |  单位: ms (中位数)  |  生成: ${new Date(generatedAt).toLocaleString('zh-CN')}`;

  const app = document.getElementById('app');
  app.innerHTML = '';

  // ── Summary cards ──
  const summaryDiv = document.createElement('div');
  summaryDiv.className = 'summary';

  // Card 1: best scroll improvement in merge scenarios
  let bestScrollRatio = 1, bestScrollName = '', bestScrollVer = '';
  for (const [name, s] of Object.entries(scenarios)) {
    if (s.category !== 'merge' && s.category !== 'combined') continue;
    const scrollKey = Object.keys(s.data[versions[0]] || {}).find(k => k.startsWith('scroll'));
    if (!scrollKey) continue;
    const vals = versions.map(v => s.data[v]?.[scrollKey]).filter(v => v != null);
    if (vals.length < 2) continue;
    const max = Math.max(...vals), min = Math.min(...vals);
    if (max / min > bestScrollRatio && min > 0) {
      bestScrollRatio = max / min;
      const maxIdx = vals.indexOf(max);
      bestScrollVer = versions[maxIdx];
      bestScrollName = s.label;
    }
  }
  if (bestScrollRatio > 1) {
    summaryDiv.innerHTML += `<div class="stat"><div class="val" style="color:#34d399">~${bestScrollRatio.toFixed(0)}x</div><div class="label">滚动性能最大提升<br>${bestScrollName}<br>最优版本 vs 最慢</div></div>`;
  }

  // Card 2: mount range
  const v10k = scenarios['vertical_10k'];
  if (v10k) {
    const mounts = versions.map(v => v10k.data[v]?.mount).filter(v => v != null);
    if (mounts.length) {
      const lo = Math.min(...mounts).toFixed(0), hi = Math.max(...mounts).toFixed(0);
      summaryDiv.innerHTML += `<div class="stat"><div class="val" style="color:#60a5fa">${lo}~${hi}</div><div class="label">纵向 10K 行 mount (ms)<br>各版本范围</div></div>`;
    }
  }

  // Card 3: min DOM nodes
  let minNodes = Infinity, minNodesName = '', minNodesVer = '';
  for (const [name, s] of Object.entries(scenarios)) {
    for (const v of versions) {
      const n = s.data[v]?.domNodes;
      if (n != null && n < minNodes) { minNodes = n; minNodesName = s.label; minNodesVer = v; }
    }
  }
  if (minNodes < Infinity) {
    summaryDiv.innerHTML += `<div class="stat"><div class="val" style="color:#fbbf24">${minNodes}</div><div class="label">最少 DOM 节点数<br>${minNodesName} (${minNodesVer})</div></div>`;
  }

  // Card 4: version count
  summaryDiv.innerHTML += `<div class="stat"><div class="val" style="color:#a78bfa">${versions.length}</div><div class="label">测试版本数<br>${generatedAt ? new Date(generatedAt).toLocaleDateString('zh-CN') : ''}</div></div>`;

  app.appendChild(summaryDiv);

  // ── Group scenarios by category ──
  const byCategory = {};
  for (const [name, s] of Object.entries(scenarios)) {
    const cat = s.category || 'other';
    if (!byCategory[cat]) byCategory[cat] = [];
    byCategory[cat].push({ name, ...s });
  }

  // ─ Mount charts per category ──
  let chartIdx = 0;
  const mountCharts = [];

  for (const [cat, items] of Object.entries(byCategory)) {
    const cfg = CATEGORY_CONFIG[cat] || { title: cat, icon: '?' };
    const sectionTitle = document.createElement('h2');
    sectionTitle.className = 'section-title';
    sectionTitle.textContent = `${cfg.icon} ${cfg.title} — 初始渲染 (mount ms)`;
    app.appendChild(sectionTitle);

    const grid = document.createElement('div');
    grid.className = 'grid';

    // Split items into pairs for 2-column layout
    for (let i = 0; i < items.length; i += 2) {
      const chunk = items.slice(i, i + 2);
      const card = document.createElement('div');
      card.className = 'card';
      const title = chunk.map(s => s.label).join(' / ');
      card.innerHTML = `<h2>${title} <span class="tag">mount ms</span></h2><div id="mc${chartIdx}" class="chart"></div>`;
      grid.appendChild(card);

      const series = chunk.map((s, si) => {
        const color = PALETTE[(chartIdx * 2 + si) % PALETTE.length];
        const d = versions.map(v => s.data[v]?.mount ?? null);
        return mkBar(s.label, d, color);
      });

      mountCharts.push({ el: `mc${chartIdx}`, series, versions: [...versions] });
      chartIdx++;
    }

    app.appendChild(grid);
  }

  // ── KEY chart: scroll performance for merge + combined ──
  const scrollScenarios = Object.entries(scenarios).filter(([name, s]) => {
    if (s.category !== 'merge' && s.category !== 'combined') return false;
    return versions.some(v => Object.keys(s.data[v] || {}).some(k => k.startsWith('scroll')));
  });

  if (scrollScenarios.length) {
    const sectionTitle = document.createElement('h2');
    sectionTitle.className = 'section-title';
    sectionTitle.textContent = '⚡ 合并/组合场景滚动性能 (scroll ms) — 核心对比';
    app.appendChild(sectionTitle);

    const card = document.createElement('div');
    card.className = 'card full';
    card.innerHTML = `<h2>滚动重算耗时 <span class="tag">scroll ms — opt-merge 绿色高亮</span></h2><div id="scrollChart" class="chart tall"></div>`;
    app.appendChild(card);

    // Build series: one per (scenario, scrollKey) pair
    const scrollSeries = [];
    const scrollColors = {};
    let ci = 0;

    for (const [name, s] of scrollScenarios) {
      const scrollKeys = new Set();
      for (const v of versions) {
        Object.keys(s.data[v] || {}).filter(k => k.startsWith('scroll')).forEach(k => scrollKeys.add(k));
      }
      for (const key of scrollKeys) {
        const color = PALETTE[ci % PALETTE.length];
        scrollColors[`${name}:${key}`] = color;
        const d = versions.map(v => s.data[v]?.[key] ?? null);
        scrollSeries.push({
          name: `${s.label} ${key}`,
          type: 'bar',
          data: d,
          itemStyle: {
            color: p => {
              const ver = versions[p.dataIndex];
              // Highlight the last version (usually opt-merge or latest)
              if (p.dataIndex === versions.length - 1) return '#34d399';
              return color;
            },
            borderRadius: [3,3,0,0]
          },
          label: { show: true, position: 'top', color: color, fontSize: 10, formatter: p => p.value != null ? p.value.toFixed(2) : '' },
          barMaxWidth: 20,
          emphasis: { focus: 'series' }
        });
        ci++;
      }
    }

    const scrollChart = echarts.init(document.getElementById('scrollChart'));
    scrollChart.setOption({
      ...baseOpt(),
      legend: { textStyle: { color: '#8b8fa3', fontSize: 10 }, top: 0, type: 'scroll' },
      grid: { left: 55, right: 30, top: 50, bottom: 40 },
      xAxis: { type: 'category', data: [...versions], axisLabel: { color: '#8b8fa3', fontSize: 11 } },
      yAxis: { type: 'value', name: 'ms', splitLine: { lineStyle: { color: '#2a2e3a' } }, axisLabel: { formatter: v => v.toFixed(2) } },
      series: scrollSeries,
      graphic: [{ type: 'text', left: 70, bottom: 2, style: { text: '▲ 绿色 = 最新/优化版本', fill: '#34d399', fontSize: 12, fontWeight: 'bold' } }]
    });
  }

  // ── DOM nodes chart ──
  const nodeScenarios = Object.entries(scenarios).filter(([name, s]) =>
    versions.some(v => s.data[v]?.domNodes != null)
  );

  if (nodeScenarios.length) {
    const sectionTitle = document.createElement('h2');
    sectionTitle.className = 'section-title';
    sectionTitle.textContent = '⊞ DOM 节点数对比';
    app.appendChild(sectionTitle);

    const card = document.createElement('div');
    card.className = 'card full';
    card.innerHTML = `<h2>渲染 DOM 元素总数 <span class="tag">nodes — 越少越好</span></h2><div id="domChart" class="chart"></div>`;
    app.appendChild(card);

    const domSeries = nodeScenarios.map(([name, s], i) => {
      const color = PALETTE[i % PALETTE.length];
      const d = versions.map(v => s.data[v]?.domNodes ?? null);
      return mkBar(s.label, d, color);
    });

    const domChart = echarts.init(document.getElementById('domChart'));
    domChart.setOption({
      ...baseOpt(),
      legend: { textStyle: { color: '#8b8fa3', fontSize: 10 }, top: 0, type: 'scroll' },
      xAxis: { type: 'category', data: [...versions], axisLabel: { color: '#8b8fa3', rotate: 20 } },
      yAxis: { type: 'value', name: 'nodes', splitLine: { lineStyle: { color: '#2a2e3a' } } },
      series: domSeries
    });
  }

  // ── Bundle size chart ──
  const sizeVersions = versions.filter(v => bundleSize[v]);
  if (sizeVersions.length) {
    const sectionTitle = document.createElement('h2');
    sectionTitle.className = 'section-title';
    sectionTitle.textContent = '📦 构建产物体积对比';
    app.appendChild(sectionTitle);

    const card = document.createElement('div');
    card.className = 'card full';
    card.innerHTML = `<h2>lib/ 产物体积 <span class="tag">KB — 未压缩 ES 构建，越小越好</span></h2><div id="sizeChart" class="chart"></div>`;
    app.appendChild(card);

    const kb = bytes => bytes != null ? +(bytes / 1024).toFixed(2) : null;
    const sizeChart = echarts.init(document.getElementById('sizeChart'));
    sizeChart.setOption({
      ...baseOpt(),
      xAxis: { type: 'category', data: [...sizeVersions], axisLabel: { color: '#8b8fa3', rotate: 20 } },
      yAxis: { type: 'value', name: 'KB', splitLine: { lineStyle: { color: '#2a2e3a' } } },
      series: [
        mkBar('JS 原始', sizeVersions.map(v => kb(bundleSize[v].jsRaw)), PALETTE[0]),
        mkBar('JS gzip', sizeVersions.map(v => kb(bundleSize[v].jsGzip)), PALETTE[7]),
        mkBar('CSS 原始', sizeVersions.map(v => kb(bundleSize[v].cssRaw)), PALETTE[4]),
      ]
    });
  }

  // ── Heatmap: all scenarios × all versions (mount) ──
  const heatmapScenarios = Object.entries(scenarios).filter(([name, s]) =>
    versions.some(v => s.data[v]?.mount != null)
  );

  if (heatmapScenarios.length) {
    const sectionTitle = document.createElement('h2');
    sectionTitle.className = 'section-title';
    sectionTitle.textContent = '️ 全场景 Mount 耗时热力图';
    app.appendChild(sectionTitle);

    const card = document.createElement('div');
    card.className = 'card full';
    card.innerHTML = `<h2>全场景对比 <span class="tag">ms — 越绿越快，越红越慢</span></h2><div id="heatChart" class="chart tall"></div>`;
    app.appendChild(card);

    const sceneLabels = heatmapScenarios.map(([name, s]) => s.label);
    const heatData = [];
    let maxVal = 0;

    heatmapScenarios.forEach(([name, s], si) => {
      versions.forEach((v, vi) => {
        const val = s.data[v]?.mount;
        if (val != null) {
          heatData.push([vi, si, val]);
          if (val > maxVal) maxVal = val;
        }
      });
    });

    const heatChart = echarts.init(document.getElementById('heatChart'));
    heatChart.setOption({
      backgroundColor: 'transparent',
      textStyle: { color: '#b0b8d0' },
      tooltip: {
        backgroundColor: '#1e2130', borderColor: '#3a3f52', textStyle: { color: '#e0e0e0' },
        formatter: p => `${versions[p.data[0]]} / ${sceneLabels[p.data[1]]}<br/><b>${p.data[2].toFixed(2)} ms</b>`
      },
      grid: { left: 110, right: 80, top: 10, bottom: 50 },
      xAxis: { type: 'category', data: [...versions], axisLabel: { color: '#8b8fa3', rotate: 25, fontSize: 11 }, splitArea: { show: true, areaStyle: { color: ['rgba(255,255,255,0.02)','rgba(0,0,0,0)'] } } },
      yAxis: { type: 'category', data: sceneLabels, axisLabel: { color: '#b0b8d0', fontSize: 11 } },
      visualMap: {
        min: 5, max: Math.min(maxVal, 100), calculable: true, orient: 'vertical', right: 5, top: 'center',
        inRange: { color: ['#064e3b','#065f46','#047857','#059669','#10b981','#34d399','#6ee7b7','#fbbf24','#f59e0b','#ef4444','#dc2626'] },
        textStyle: { color: '#8b8fa3' }, text: ['慢', '快'],
      },
      series: [{
        type: 'heatmap', data: heatData,
        label: { show: true, color: '#fff', fontSize: 10, formatter: p => p.data[2].toFixed(1) },
        itemStyle: { borderColor: '#181b24', borderWidth: 2, borderRadius: 3 },
        emphasis: { itemStyle: { shadowBlur: 10, shadowColor: 'rgba(0,0,0,0.5)' } }
      }]
    });
  }

  // ── Render mount charts (created above as deferred) ──
  for (const mc of mountCharts) {
    const chart = echarts.init(document.getElementById(mc.el));
    chart.setOption({
      ...baseOpt(),
      xAxis: { type: 'category', data: mc.versions, axisLabel: { color: '#8b8fa3', rotate: 20 } },
      yAxis: { type: 'value', name: 'ms', splitLine: { lineStyle: { color: '#2a2e3a' } } },
      series: mc.series
    });
  }

  // ─ Responsive resize ──
  window.addEventListener('resize', () => {
    document.querySelectorAll('.chart').forEach(el => {
      const inst = echarts.getInstanceByDom(el);
      if (inst) inst.resize();
    });
  });

})();
</script>
</body>
</html>
